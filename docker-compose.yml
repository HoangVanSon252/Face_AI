# Base stack (production-safe): only the frontend (Nginx) is published.
# Local development also loads docker-compose.override.yml automatically, which
# publishes MySQL/Redis/backend/AI ports on 127.0.0.1 for debugging tools.
# Production: docker compose -f docker-compose.yml up -d
services:
  mysql:
    image: mysql:8.0.46
    container_name: face_attendance_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DB:-face_attendance_db}
    # max_connections must exceed (DB_POOL_SIZE + DB_MAX_OVERFLOW) x BACKEND_WORKERS.
    command:
      - --max_connections=${MYSQL_MAX_CONNECTIONS:-200}
      - --innodb_buffer_pool_size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-512M}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # MYSQL_PWD keeps the password out of the process argument list.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h localhost -uroot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.11-alpine
    container_name: face_attendance_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  object-storage:
    # SeaweedFS exposes an S3-compatible API and remains publicly pullable.
    image: chrislusf/seaweedfs:4.48
    container_name: face_attendance_object_storage
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      S3_BUCKET: face-attendance
    volumes:
      - minio_data:/data

  ai_service:
    build: ./ai_service
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # The det_score liveness heuristic is only allowed when ENVIRONMENT=development
      # and DEBUG=true; any other combination fails closed without a model.
      DEBUG: ${DEBUG:-false}
      MODEL_PROVIDERS: CPUExecutionProvider
      DETECTION_SIZE: 640
      # Each worker loads its own models (~0.5-1GB RAM). Keep
      # AI_WORKERS x ONNX_INTRA_OP_THREADS <= CPU cores given to this container.
      AI_WORKERS: ${AI_WORKERS:-3}
      ONNX_INTRA_OP_THREADS: ${ONNX_INTRA_OP_THREADS:-2}
      # Anti-spoofing ensemble built by scripts/liveness/build_models.sh into ai_service/models.
      LIVENESS_MODELS: ${LIVENESS_MODELS:-}
      LIVENESS_OUTPUT_TYPE: ${LIVENESS_OUTPUT_TYPE:-auto}
      LIVENESS_MODEL_PATH: ${LIVENESS_MODEL_PATH:-}
      LIVENESS_THRESHOLD: ${LIVENESS_THRESHOLD:-0.85}
      LIVENESS_INPUT_WIDTH: ${LIVENESS_INPUT_WIDTH:-112}
      LIVENESS_INPUT_HEIGHT: ${LIVENESS_INPUT_HEIGHT:-112}
      LIVENESS_INPUT_LAYOUT: ${LIVENESS_INPUT_LAYOUT:-NCHW}
      LIVENESS_COLOR_SPACE: ${LIVENESS_COLOR_SPACE:-RGB}
      LIVENESS_NORMALIZATION: ${LIVENESS_NORMALIZATION:-zero_one}
      LIVENESS_LIVE_CLASS_INDEX: ${LIVENESS_LIVE_CLASS_INDEX:-1}
    volumes:
      - ./ai_service/models:/models:ro
      - ./scripts:/app/scripts:ro
      - insightface_models:/root/.insightface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 300s

  backend:
    build: ./backend
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DB: ${MYSQL_DB:-face_attendance_db}
      MYSQL_SSL_REQUIRED: ${MYSQL_SSL_REQUIRED:-false}
      MYSQL_SSL_CA: ${MYSQL_SSL_CA:-}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      CSRF_SECRET_KEY: ${CSRF_SECRET_KEY:?Set CSRF_SECRET_KEY in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
      AI_SERVICE_URL: http://ai_service:8002
      OBJECT_STORAGE_ENDPOINT: http://object-storage:8333
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      OBJECT_STORAGE_BUCKET: face-attendance
      OBJECT_STORAGE_SECURE: "false"
      # Total DB connections = (DB_POOL_SIZE + DB_MAX_OVERFLOW) x BACKEND_WORKERS.
      BACKEND_WORKERS: ${BACKEND_WORKERS:-4}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-15}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-15}
      # Only Nginx reaches the backend inside the Docker network, so trust its
      # X-Forwarded-For header; rate limits then apply per real client IP.
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai_service:
        condition: service_healthy
      object-storage:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  mysql_data:
  minio_data:
  insightface_models:
